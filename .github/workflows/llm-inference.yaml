name: LLM Inference

on:
  workflow_dispatch:

jobs:
  run:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test Local Action
        id: inference
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          prompt: "Analyze recent workflow runs and check security alerts"
          enable-github-mcp: false
          model: openai/gpt-4.1-mini
      - name: Print Output
        id: output
        run: echo "${{ steps.inference.outputs.response }}"
