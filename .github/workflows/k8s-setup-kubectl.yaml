name: setup kubectl
on:
  workflow_dispatch:

env:
  KUBECTL_VERSION: "v1.32.0"

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: kubectl version --client
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - run: kubectl version --client
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: "latest"
      - run: kubectl version --client
